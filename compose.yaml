services:
  streamforge:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "50000-50050:50000-50050/udp"
    environment:
      ADDR: 0.0.0.0:8080
      RTC_UDP_MIN: "50000"
      RTC_UDP_MAX: "50050"
      RTC_PUBLIC_IP: ${RTC_PUBLIC_IP:-127.0.0.1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-localhost:8080,127.0.0.1:8080}
      STUN_URL: ${STUN_URL:-}
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [streamforge]
  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-streamforge-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboard.json:/var/lib/grafana/dashboards/streamforge.json:ro
    depends_on: [prometheus]
  coturn:
    image: coturn/coturn:4.6.3
    profiles: [turn]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-set-a-random-secret}
      - --realm=streamforge.local
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${RTC_PUBLIC_IP:-127.0.0.1}
      - --log-file=stdout
    restart: unless-stopped
